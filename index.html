<style>
:root{--bg:#050507;--surface:#121215;--border:#1E1E22;--border2:#2A2A30;--dim:#8B8B92}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Inter',system-ui,sans-serif}
.highlight{background:linear-gradient(90deg,#FFD60A 0%,#FF8A00 35%,#FF2A2A 70%,#FF00E5 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 24px rgba(255,214,10,.35);font-weight:900;letter-spacing:-.04em}
.header{position:sticky;top:0;z-index:100;background:rgba(5,5,7,.92);backdrop-filter:blur(22px);border-bottom:1px solid var(--border);height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.logo{display:flex;gap:16px;align-items:center}
.logo-icon{width:58px;height:58px;background:#0a1931;background:linear-gradient(135deg,#0a1931,#001a4d);border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:24px;color:#000;box-shadow:0 0 26px rgba(0,180,255,.35);border:1px solid rgba(0,200,255,0.3);overflow:hidden;padding:4px}
.logo-icon img{width:100%;height:100%;object-fit:contain}
.live{padding:8px 14px;background:#151518;border:1px solid var(--border2);border-radius:999px;font-size:11px;font-weight:800;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;background:#FF1E1E;border-radius:50%;box-shadow:0 0 12px #FF1E1E;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,30,30,.6)}70%{box-shadow:0 0 0 10px rgba(255,30,30,0)}100%{box-shadow:0 0 0 0 rgba(255,30,30,0)}}
.hero{max-width:1600px;margin:0 auto;padding:22px}
.player-shell{border-radius:20px;overflow:hidden;border:1px solid #FFD60A;box-shadow:0 0 0 1px rgba(255,214,10,.15),0 20px 60px rgba(0,0,0,.6);background:#000;position:relative}
.video-wrap{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:default}
.topbar{position:absolute;top:0;left:0;right:0;padding:14px;display:flex;justify-content:space-between;pointer-events:none;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}
.brand{pointer-events:auto;padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);border-radius:999px;font-size:12px;font-weight:800}
.yt-wrap-main{position:absolute;inset:0;z-index:2;background:#000}
.yt-wrap-main iframe,#player{width:100%;height:100%;border:0;display:block}
.yt-mask{position:absolute;bottom:12px;right:12px;z-index:35;background:#0a1931;background:linear-gradient(135deg,#0a1931 0%,#001a4d 100%);padding:7px 12px 7px 14px;border-radius:12px;display:flex;align-items:center;gap:12px;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.8),0 0 0 1px rgba(0,200,255,0.3);border:1px solid rgba(0,180,255,0.35);max-width:75%;transform:none !important;opacity:1 !important;transition:none}
.yt-mask-title{color:#fff;font-size:12px;font-weight:700;letter-spacing:0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
.yt-mask img{height:30px;width:auto;display:block;object-fit:contain;filter:brightness(1.1);flex-shrink:0}
@media(max-width:768px){.yt-mask{bottom:12px;right:8px;padding:5px 10px;gap:8px;max-width:82%;z-index:35}.yt-mask-title{font-size:11px;max-width:170px}.yt-mask img{height:24px}}
@media(max-width:480px){.yt-mask{bottom:10px;right:6px;max-width:78%}.yt-mask-title{max-width:110px;font-size:10px}}


/* Em tela cheia - esconde demais informações mas MANTÉM o logo */
#shell:fullscreen .topbar,
#shell:-webkit-full-screen .topbar,
#shell:-moz-full-screen .topbar,
#shell:fullscreen .topcover,
#shell:-webkit-full-screen .topcover,
#shell:-moz-full-screen .topcover,
#shell:fullscreen .brand,
#shell:-webkit-full-screen .brand{
  display:none !important;
  opacity:0 !important;
  visibility:hidden !important;
}
#shell:fullscreen .yt-mask,
#shell:-webkit-full-screen .yt-mask,
#shell:-moz-full-screen .yt-mask{
  display:flex !important;
  opacity:1 !important;
  visibility:visible !important;
}
#shell:fullscreen,
#shell:-webkit-full-screen,
#shell:-moz-full-screen{
  border-radius:0 !important;
  border:none !important;
}

.yt-mask{pointer-events:none !important}
.video-wrap:hover .yt-mask,.video-wrap .yt-mask{transform:none !important;opacity:1 !important;visibility:visible !important}

.topcover{position:absolute;top:0;left:0;right:0;height:70px;background:linear-gradient(180deg,rgba(5,5,7,.95),transparent);pointer-events:none;z-index:5}
.custom-controls{position:absolute;bottom:0;left:0;right:0;z-index:25;background:#050507;background:rgba(5,5,7,0.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.1);padding:0;transform:translateY(100%);opacity:0;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.25s ease;pointer-events:none;box-shadow:0 -10px 30px rgba(0,0,0,0.98)}
.video-wrap:hover .custom-controls,.custom-controls.visible{transform:translateY(0);opacity:1;pointer-events:auto}
.progress-container{width:100%;height:9px;background:rgba(255,255,255,0.18);cursor:pointer;position:relative;transition:height 0.2s}
.progress-container:hover{height:13px;background:rgba(255,255,255,0.32)}
.progress-bar{width:100%;height:100%;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#FFD60A,#FF8A00);width:0%;transition:width 0.15s linear;box-shadow:0 0 10px rgba(255,214,10,0.7);position:relative}
.progress-fill::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:16px;height:16px;background:#FFD60A;border-radius:50%;box-shadow:0 0 10px rgba(255,214,10,0.9);opacity:0;transition:opacity 0.2s;border:2px solid #000}
.progress-container:hover .progress-fill::after{opacity:1}
.controls-row{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 20px;gap:14px;background:rgba(5,5,7,0.98);background:#050507;min-height:62px}
.left-controls,.right-controls{display:flex;align-items:center;gap:10px}
.ctrl-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.12);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:0.2s;backdrop-filter:blur(10px)}
.ctrl-btn:hover{background:#FFD60A;color:#000;border-color:#FFD60A;transform:scale(1.08);box-shadow:0 0 14px rgba(255,214,10,0.5)}
.ctrl-btn.play-pause{width:52px;height:52px;background:#fff;color:#000;border-color:#fff;font-size:20px}
.ctrl-btn.play-pause:hover{background:#FFD60A;border-color:#FFD60A}
.time-display{font-size:12px;color:#ddd;font-weight:600;letter-spacing:0.02em;min-width:100px}
.title-display{font-size:12px;color:#FFD60A;font-weight:700;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
@media(min-width:900px){.title-display{display:block}}
.volume-slider{width:110px;height:5px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.25);border-radius:3px;outline:none;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#FFD60A;cursor:pointer;box-shadow:0 0 8px rgba(255,214,10,0.7)}
.volume-slider::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#FFD60A;border:none;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 22px 80px;max-width:1600px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--border2)}
.card.active{border-color:#FFD60A;box-shadow:0 0 0 1px #FFD60A,0 0 20px rgba(255,214,10,.25)}
.thumb{aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:.3s}
.card:hover .thumb img{transform:scale(1.05)}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;background:rgba(255,255,255,.92);border-radius:50%;display:grid;place-items:center;color:#000;font-size:18px;z-index:2}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px auto 0;max-width:1600px;padding:0 22px}
.tools input{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:#fff;width:260px;outline:none}
.fbtn{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--dim);font-size:11px;font-weight:700;cursor:pointer}
.fbtn.active{background:#fff;color:#000;border-color:#fff}
.nowplaying{margin:12px 0 0;padding:12px 16px;background:linear-gradient(90deg,rgba(255,214,10,.12),rgba(255,42,42,.08));border:1px solid rgba(255,214,10,.25);border-radius:12px;display:flex;align-items:center;gap:12px}

{id:'daEzSIxULB0',t:'Treinamento Mortal',g:'Ação / Espionagem',y:''},
{id:'OdC2Q-riqAw',t:'Contrato Perigoso',g:'Ação',y:'2022'}
];
function catOf(m){
  const g = (m.g||'') + ' ' + (m.t||'');
  const s = g.toUpperCase();
  if(s.includes('TERROR'))return'Terror';
  if(s.includes('FICÇÃO')||s.includes('FICCAO')||s.includes('SCI-FI')||s.includes('FICÇÃO CIENTÍFICA')||s.includes('GUARDIAN')||s.includes('BLADE')||s.includes('DOMINION')||s.includes('VENOM')||s.includes('OUTLANDER')||s.includes('AUTOMATA')||s.includes('FUTURO'))return'Ficção';
  if(s.includes('SUSPENSE')||s.includes('CONFIANÇA')||s.includes('IDENTIDADE')||s.includes('ARANHA')||s.includes('SEM CULPA')||s.includes('SEM SAÍDA'))return'Suspense';
  if(s.includes('DESASTRE')||s.includes('FIM DO MUNDO')||s.includes('PROFECIA')||s.includes('STORM')||s.includes('ICE')||s.includes('SUBMERSA')||s.includes('AMÉRICA'))return'Desastre';
  return'Ação';
}
const CATS=['Todos','Ação','Terror','Ficção','Suspense','Desastre'];
let active='Todos',q='',currentIndex=0,player=null,playerReady=false;
const grid=document.getElementById('grid'),filters=document.getElementById('filters'),search=document.getElementById('search'),nowTitle=document.getElementById('nowTitle');

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}
let playOrder=shuffleArray([...Array(MOVIES.length).keys()]);
let orderPos=0;

function getRandomIndex(){return Math.floor(Math.random()*MOVIES.length);}

function updateTitle(i){
  nowTitle.textContent=MOVIES[i].t;
  currentIndex=i;
  const idxInOrder=playOrder.indexOf(i);
  if(idxInOrder!==-1)orderPos=idxInOrder;
  const ctrlTitle=document.getElementById('ctrlTitle');
  if(ctrlTitle)ctrlTitle.textContent=MOVIES[i].t;
  const ytMaskTitle=document.getElementById('ytMaskTitle');
  if(ytMaskTitle)ytMaskTitle.textContent=MOVIES[i].t;
  renderGrid();
}

function playIndex(i){
  if(i<0||i>=MOVIES.length)return;
  const videoId=MOVIES[i].id;
  updateTitle(i);
  const ytMain=document.getElementById('ytMain');
  if(playerReady && player && typeof player.loadVideoById==='function'){
    try{
      player.loadVideoById(videoId);
      try{player.unMute();player.setVolume(100);}catch(_){}
      return;
    }catch(e){}
  }
  let iframe=document.getElementById('ytFrame');
  if(iframe){
    iframe.src='https://www.youtube-nocookie.com/embed/'+videoId+'?autoplay=1&rel=0&modestbranding=1&controls=0';
  }else{
    ytMain.innerHTML='<iframe id="ytFrame" src="https://www.youtube-nocookie.com/embed/'+videoId+'?autoplay=1&rel=0&modestbranding=1&controls=0" style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media" allowfullscreen></iframe><div class="topcover"></div><div class="yt-mask"><span class="yt-mask-title" id="ytMaskTitle">Carregando...</span><img src="https://i.ibb.co/gb8gZvxM/44992.png" alt="NEOVIZER CHANNEL"></div>';
  }
}

window.onYouTubeIframeAPIReady=function(){
  try{
    const playerDiv=document.getElementById('player');
    if(!playerDiv){
      const ytMain=document.getElementById('ytMain');
      ytMain.innerHTML='<div id="player"></div><div class="topcover"></div><div class="yt-mask"><span class="yt-mask-title" id="ytMaskTitle">Carregando...</span><img src="https://i.ibb.co/gb8gZvxM/44992.png" alt="NEOVIZER CHANNEL"></div>'+ytMain.innerHTML;
    }
    player=new YT.Player('player',{
      height:'100%',width:'100%',
      videoId:MOVIES[currentIndex].id,
      playerVars:{rel:0,modestbranding:1,iv_load_policy:3,playsinline:1,autoplay:1,controls:0,disablekb:0,fs:0},
      events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange,onError:onPlayerError}
    });
  }catch(e){}
};

function onPlayerReady(e){
  playerReady=true;
  try{e.target.unMute();e.target.setVolume(100);e.target.playVideo();}catch(err){try{e.target.playVideo();}catch(_){}}
}

function onPlayerStateChange(e){
  const ctrlPlay=document.getElementById('ctrlPlay');
  if(e.data===YT.PlayerState.PLAYING){if(ctrlPlay)ctrlPlay.textContent='❚❚';}
  if(e.data===YT.PlayerState.PAUSED){if(ctrlPlay)ctrlPlay.textContent='▶';}
  if(e.data===YT.PlayerState.ENDED){
    orderPos++;
    if(orderPos>=playOrder.length){playOrder=shuffleArray([...Array(MOVIES.length).keys()]);orderPos=0;}
    playIndex(playOrder[orderPos]);
  }
}

function onPlayerError(e){
  orderPos++;
  if(orderPos>=playOrder.length){playOrder=shuffleArray([...Array(MOVIES.length).keys()]);orderPos=0;}
  setTimeout(function(){playIndex(playOrder[orderPos])},800);
}

function renderFilters(){
  filters.innerHTML=CATS.map(function(c){return '<button class="fbtn '+(c===active?'active':'')+'" data-c="'+c+'">'+c+'</button>'}).join('');
  filters.querySelectorAll('.fbtn').forEach(function(b){b.onclick=function(){active=b.dataset.c;renderFilters();renderGrid()}})
}

function renderGrid(){
  const list=MOVIES.filter(function(m){
    const ok=active==='Todos'||catOf(m)===active;
    return ok&&(!q||m.t.toLowerCase().indexOf(q.toLowerCase())!==-1)
  });
  grid.innerHTML=list.map(function(m){
    const realIdx=MOVIES.findIndex(function(x){return x.id===m.id});
    const isActive=realIdx===currentIndex;
    return '<div class="card '+(isActive?'active':'')+'" data-idx="'+realIdx+'"><div class="thumb"><img loading="lazy" src="https://img.youtube.com/vi/'+m.id+'/hqdefault.jpg" onerror="this.src=\'https://img.youtube.com/vi/'+m.id+'/mqdefault.jpg\'"><div class="play">▶</div><div style="position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800">'+catOf(m).toUpperCase()+'</div></div><div style="padding:10px"><div style="font-size:13px;font-weight:600;line-height:1.3">'+m.t+'</div><div style="font-size:10px;color:#888;margin-top:4px"><span class="highlight" style="font-size:10px">NEOVIZER</span> • '+(isActive?'TOCANDO AGORA':'')+' DUBLADO HD</div></div></div>'
  }).join('');
  document.querySelectorAll('.card').forEach(function(c){
    c.onclick=function(){const idx=parseInt(c.dataset.idx);playIndex(idx);};
  });
}

search.oninput=function(e){q=e.target.value;renderGrid()}
renderFilters();

const initialRandom=getRandomIndex();
currentIndex=initialRandom;
playOrder=shuffleArray([...Array(MOVIES.length).keys()]);
const posInitial=playOrder.indexOf(initialRandom);
orderPos=posInitial!==-1?posInitial:0;

(function initPlayer(){
  const ytMain=document.getElementById('ytMain');
  ytMain.innerHTML='<iframe id="ytFrame" src="https://www.youtube-nocookie.com/embed/'+MOVIES[initialRandom].id+'?autoplay=1&rel=0&modestbranding=1&controls=0" style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media" allowfullscreen></iframe><div class="topcover"></div><div class="yt-mask"><span class="yt-mask-title" id="ytMaskTitle">Carregando...</span><img src="https://i.ibb.co/gb8gZvxM/44992.png" alt="NEOVIZER CHANNEL"></div>';
  updateTitle(initialRandom);
})();

renderGrid();

document.getElementById('nextBtn').onclick=function(){
  orderPos++;
  if(orderPos>=playOrder.length){playOrder=shuffleArray([...Array(MOVIES.length).keys()]);orderPos=0;}
  playIndex(playOrder[orderPos]);
};

document.getElementById('prevBtn').onclick=function(){
  orderPos--;
  if(orderPos<0){playOrder=shuffleArray([...Array(MOVIES.length).keys()]);orderPos=playOrder.length-1;}
  playIndex(playOrder[orderPos]);
};

// CUSTOM CONTROLS SOBREPONDO YOUTUBE - APARECE AO PASSAR MOUSE
(function(){
  const mainWrap=document.getElementById('mainWrap');
  const customControls=document.getElementById('customControls');
  const ctrlPlay=document.getElementById('ctrlPlay');
  const ctrlPrev=document.getElementById('ctrlPrev');
  const ctrlNext=document.getElementById('ctrlNext');
  const ctrlMute=document.getElementById('ctrlMute');
  const ctrlFullscreen=document.getElementById('ctrlFullscreen');
  const volumeSlider=document.getElementById('volumeSlider');
  const progressContainer=document.getElementById('progressContainer');
  const progressFill=document.getElementById('progressFill');
  const timeDisplay=document.getElementById('timeDisplay');
  let hideTimeout=null;

  function showControls(){
    customControls.classList.add('visible');
    clearTimeout(hideTimeout);
    hideTimeout=setTimeout(function(){customControls.classList.remove('visible');},3000);
  }
  function hideControls(){customControls.classList.remove('visible');}

  mainWrap.addEventListener('mousemove',showControls);
  mainWrap.addEventListener('mouseenter',showControls);
  mainWrap.addEventListener('mouseleave',hideControls);
  customControls.addEventListener('mouseenter',function(){clearTimeout(hideTimeout);});
  customControls.addEventListener('mouseleave',function(){hideTimeout=setTimeout(function(){customControls.classList.remove('visible');},500);});

  function formatTime(sec){
    sec=Math.floor(sec||0);
    const m=Math.floor(sec/60);
    const s=sec%60;
    return (m<10?'0'+m:m)+':'+(s<10?'0'+s:s);
  }

  function updateProgress(){
    try{
      if(playerReady && player && typeof player.getCurrentTime==='function' && typeof player.getDuration==='function'){
        const current=player.getCurrentTime();
        const duration=player.getDuration();
        if(duration>0){
          const percent=(current/duration)*100;
          progressFill.style.width=percent+'%';
          timeDisplay.textContent=formatTime(current)+' / '+formatTime(duration);
        }
        const state=player.getPlayerState();
        if(ctrlPlay){
          if(state===1){ctrlPlay.textContent='❚❚';}
          else{ctrlPlay.textContent='▶';}
        }
        try{
          const muted=player.isMuted();
          if(ctrlMute)ctrlMute.textContent=muted?'🔇':'🔊';
        }catch(_){}
      }
    }catch(e){}
  }

  setInterval(updateProgress,600);

  if(ctrlPlay)ctrlPlay.onclick=function(){
    if(playerReady && player){
      try{
        const state=player.getPlayerState();
        if(state===1){player.pauseVideo();}
        else{player.playVideo();}
      }catch(e){}
    }else{
      const iframe=document.getElementById('ytFrame');
      if(iframe){iframe.src=iframe.src;}
    }
    showControls();
  };

  if(ctrlPrev)ctrlPrev.onclick=function(){
    orderPos--;
    if(orderPos<0){playOrder=shuffleArray([...Array(MOVIES.length).keys()]);orderPos=playOrder.length-1;}
    playIndex(playOrder[orderPos]);
    showControls();
  };

  if(ctrlNext)ctrlNext.onclick=function(){
    orderPos++;
    if(orderPos>=playOrder.length){playOrder=shuffleArray([...Array(MOVIES.length).keys()]);orderPos=0;}
    playIndex(playOrder[orderPos]);
    showControls();
  };

  if(ctrlMute)ctrlMute.onclick=function(){
    if(playerReady && player){
      try{
        if(player.isMuted()){player.unMute();player.setVolume(volumeSlider.value);this.textContent='🔊';}
        else{player.mute();this.textContent='🔇';}
      }catch(e){}
    }
    showControls();
  };

  if(volumeSlider)volumeSlider.oninput=function(){
    const vol=this.value;
    if(playerReady && player){
      try{player.setVolume(vol);player.unMute();if(ctrlMute)ctrlMute.textContent=vol==0?'🔇':'🔊';}catch(e){}
    }
  };

  if(progressContainer)progressContainer.onclick=function(e){
    const rect=this.getBoundingClientRect();
    const pos=(e.clientX-rect.left)/rect.width;
    if(playerReady && player && typeof player.getDuration==='function'){
      try{
        const duration=player.getDuration();
        player.seekTo(duration*pos,true);
      }catch(err){}
    }
  };

  if(ctrlFullscreen)ctrlFullscreen.onclick=function(){
    const shell=document.getElementById('shell');
    if(!document.fullscreenElement){shell.requestFullscreen().catch(function(){});}
    else{document.exitFullscreen();}
    showControls();
  };

  
  // Em tela cheia - esconde demais infos mas MANTÉM o logo
  document.addEventListener('fullscreenchange', function(){
    const topbar = document.querySelector('.topbar');
    const topcover = document.querySelector('.topcover');
    const ytMask = document.querySelector('.yt-mask');
    const isFull = !!document.fullscreenElement;
    if(topbar){ topbar.style.display = isFull ? 'none' : ''; }
    if(topcover){ topcover.style.display = isFull ? 'none' : ''; }
    // Logo permanece visível mesmo em tela cheia
    if(ytMask){ ytMask.style.display = ''; ytMask.style.opacity = '1'; ytMask.style.visibility = 'visible'; }
  });

  setTimeout(showControls,1200);
})();
</script>
</body>
